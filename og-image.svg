<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1F2336"/>
  <!-- Subtle orange corner glow -->
  <circle cx="1180" cy="-20" r="420" fill="#FD5A1E" opacity="0.10"/>
  <circle cx="1180" cy="-20" r="240" fill="#FD5A1E" opacity="0.10"/>

  <!-- H1 — Anton, four lines, properly spaced -->
  <g font-family="Anton, sans-serif" font-size="76" fill="#F6F3EC" letter-spacing="0.02em">
    <text x="60" y="132">ON JULY 1, SAN FRANCISCO IS</text>
    <text x="60" y="226">POISED TO DISMANTLE ITS</text>
    <text x="60" y="320">MOST UNIQUELY EFFECTIVE</text>
    <text x="60" y="414">PUBLIC SAFETY PROGRAM.<tspan fill="#FD5A1E" dx="6">*</tspan></text>
  </g>

  <!-- Strike-through over JULY 1, -->
  <line x1="155" y1="106" x2="395" y2="106" stroke="#FD5A1E" stroke-width="6" stroke-linecap="round"/>

  <!-- Orange underlines beneath line 3 and line 4 -->
  <line x1="60" y1="334" x2="800" y2="334" stroke="#FD5A1E" stroke-width="6" stroke-linecap="round"/>
  <line x1="60" y1="428" x2="760" y2="428" stroke="#FD5A1E" stroke-width="6" stroke-linecap="round"/>

  <!-- Rally — Manrope italic, with orange asterisk + underline on "we can stop this." -->
  <g transform="translate(60, 510)">
    <text x="0" y="0" font-family="Manrope, sans-serif" font-weight="800" font-size="32" fill="#FD5A1E">*</text>
    <text x="34" y="0" font-family="Manrope, sans-serif" font-weight="700" font-size="32" fill="#F6F3EC" font-style="italic" transform="skewX(-10)">Together, <tspan font-weight="800" text-decoration="underline">we can stop this.</tspan></text>
  </g>

  <!-- URL — Manrope -->
  <text x="60" y="582" font-family="Manrope, sans-serif" font-weight="700" font-size="22" letter-spacing="2.5" fill="#FD5A1E">dontdismantlesf.org</text>
</svg>
